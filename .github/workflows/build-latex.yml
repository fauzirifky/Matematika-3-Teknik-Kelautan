name: Compile LaTeX PDFs

on:
  push:
    branches: [main]
    paths:
      - '**/*.tex'
      - 'assets/**'
      - 'tools/build.sh'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Compile all LaTeX sources
        run: bash tools/build.sh --force

      - name: Commit refreshed PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated PDF changes."
          else
            git commit -m "Auto-compile LaTeX PDFs [skip ci]"
            git push
          fi
